name: Build mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarkov-search-mod/tarkov-search-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Fabric Loom 1.14.x requires Gradle 9.2+ (its plugin declares
      # org.gradle.plugin.api-version = 9.2.0). The repo doesn't ship a
      # Gradle wrapper jar (binary file), so we let this action install a
      # matching Gradle distribution directly and use it in place of
      # ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: tarkov-search-mod-jar
          path: tarkov-search-mod/tarkov-search-mod/build/libs/*.jar
          if-no-files-found: error
